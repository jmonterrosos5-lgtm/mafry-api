# Entorno local completo. Los secretos se leen de .env (no se escriben aquí).
services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@postgres:5432/mafry_db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      AUTO_MIGRATE: 'true'
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_VENDEDOR_PASSWORD: ${SEED_VENDEDOR_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mafry_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Solo accesible desde la red interna de Docker (puerto no publicado)
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      retries: 10
volumes:
  pgdata:
