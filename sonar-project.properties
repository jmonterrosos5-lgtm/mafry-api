# Configuración de SonarCloud para MAFRY (Fase 2 — E12)
# Si al importar el proyecto SonarCloud le asigna otra clave u organización,
# actualizar estas dos líneas con los valores que muestra SonarCloud.
sonar.organization=jmonterrosos5-lgtm
sonar.projectKey=jmonterrosos5-lgtm_mafry-api
sonar.projectName=MAFRY API

# Código bajo evaluación: API (src), panel web (public/admin) y scripts de operación
sonar.sources=src,public/admin,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Fuera de alcance: app móvil Flutter (no es parte de la aplicación web evaluada),
# imágenes, documentación y dependencias.
sonar.exclusions=mafry_movil/**,docs/**,**/node_modules/**,public/admin/img/**,coverage/**,reports/**

# Cobertura: unitarias (módulos críticos) + integración (resto de la API)
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integracion/lcov.info
# Scripts de mantenimiento (migración, semilla, respaldo) y el código de eventos del panel
# se validan con las pruebas de API/manuales, no con cobertura unitaria.
sonar.coverage.exclusions=scripts/**,public/admin/app.js,src/server.js

# Las pruebas no se analizan como código duplicado
sonar.cpd.exclusions=tests/**
